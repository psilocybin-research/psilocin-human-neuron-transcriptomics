SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [".gitignore", "PUBLICATION_MANIFEST.json", "FILE_LICENSES.json", "SHA256SUMS", "explorer/package-lock.json", "renv.lock", "renv.figures.lock"]
