name: Validate repository
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install -r requirements.release.txt
      - run: cffconvert --validate
      - run: python src/validate_release.py
      - run: python -m pytest -q
      - run: reuse lint
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - run: npm --prefix explorer ci
      - run: npm --prefix explorer test
      - run: npm --prefix explorer run build
