name: Validate repository
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install -r requirements.release.txt
      - run: cffconvert --validate
      - run: python src/validate_release.py
      - run: python -m pytest -q --ignore=tests/test_bayesian_oxphos.py --ignore=tests/test_bayesian_score_reproduction.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - run: Rscript tests/test_transcriptomics.R
      - name: Verify R results bundle
        run: Rscript tests/test_r_results_bundle.R
      - run: reuse lint
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - run: npm --prefix explorer ci
      - run: npm --prefix explorer test
      - run: npm --prefix explorer run build

  research-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - run: npm --prefix explorer ci
      - run: npm --prefix explorer run build
      - name: Install browser for research integration checks
        working-directory: explorer
        run: npx playwright install --with-deps chromium
      - name: Verify research integration and R session recovery
        timeout-minutes: 12
        working-directory: explorer
        run: |
          export BROWSER_PATH="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/atlas-browser-server.log 2>&1 &
          atlas_server_pid=$!
          trap 'kill "$atlas_server_pid"' EXIT
          node test/research-integration-browser-check.mjs
          node test/shared-r-browser-check.mjs

  bayesian-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.bayes.lock.txt
      - run: python -m pip install -r requirements.bayes.lock.txt
      - run: python -m src.transcriptomics.reproduce_bayesian_scores --verify-only
      - run: python -m unittest discover -s tests -p 'test_bayesian*.py'
