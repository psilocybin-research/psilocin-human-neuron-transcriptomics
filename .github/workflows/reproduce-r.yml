name: Run R quick start
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quick-start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - name: Reproduce the documented R results
        run: Rscript src/quick_start.R
      - name: Add results to the run summary
        if: always()
        run: |
          if [ -f artifacts/r-quick-start/summary.md ]; then
            cat artifacts/r-quick-start/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload tables and R session information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-quick-start-${{ github.run_id }}
          path: artifacts/r-quick-start/
          if-no-files-found: error
          retention-days: 30
